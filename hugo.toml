baseURL = "https://claudeghostwriter.com/"
languageCode = "en"
title = "Claude Ghost Writer"
enableRobotsTXT = true
disableKinds = ["RSS"]

[taxonomies]
  genre = "genres"

[params]
  description = "A Claude Code plugin to write books with Claude — in your own voice. Dialogue, drafting, hostile critique, integration. Free and open source."
  repo = "https://github.com/simonediroma/claude-ghost-writer"
  siteRepo = "https://github.com/simonediroma/claudeghostwriter.com"
  marketplaceRepo = "simonediroma/claude-ghost-writer"
  pluginId = "ghost-writer@simonediroma-ghost-writer"
  author = "Simone Di Roma"
  authorUrl = "https://github.com/simonediroma"
  # Plugin page on claude.ai — main "Install" button. Leave empty to point to the install section.
  installUrl = "https://claude.ai/customize/plugins/id/4b831b3b-c718-4a20-b786-598ed6566696%40anthropic-plugin-directory"

[menus]
  [[menus.main]]
    name = "Features"
    url = "#features"
    weight = 10
  [[menus.main]]
    name = "Guides"
    pageRef = "/guides"
    weight = 20
  [[menus.main]]
    name = "Gallery"
    pageRef = "/books"
    weight = 30
    [menus.main.params]
      keep = true
  [[menus.main]]
    name = "Install"
    url = "#install"
    weight = 40
    [menus.main.params]
      keep = true

[markup.goldmark.renderer]
  unsafe = false

[markup.highlight]
  noClasses = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
